<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GCC TBC Typing Exam</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #e7ebef;
            color: #222;
            font-family: Arial, "Noto Sans Devanagari", sans-serif;
            overflow: hidden;
        }


        /* ==============================
           TOP HEADER
        ============================== */

        .exam-header {

            height: 62px;

            background: #0b5cab;

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 8px 15px;

            gap: 15px;

        }


        .exam-title {

            font-size: 21px;

            font-weight: bold;

            white-space: nowrap;

        }


        .exam-info {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .info-box {

            background: white;

            color: #222;

            padding: 8px 12px;

            border-radius: 3px;

            font-size: 14px;

            font-weight: bold;

        }


        .timer {

            background: #b30000;

            color: white;

            min-width: 88px;

            padding: 8px 12px;

            text-align: center;

            border-radius: 3px;

            font-size: 20px;

            font-weight: bold;

            font-family: monospace;

        }


        /* ==============================
           EXAM AREA
        ============================== */

        .exam-container {

            height: calc(100vh - 112px);

            padding: 10px;

        }


        .exam-panels {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            height: 100%;

        }


        .panel {

            background: white;

            border: 1px solid #9da7b0;

            display: flex;

            flex-direction: column;

            min-width: 0;

            overflow: hidden;

        }


        .panel-title {

            height: 40px;

            background: #d7e2ed;

            border-bottom: 1px solid #aeb7c2;

            display: flex;

            align-items: center;

            padding: 0 12px;

            font-size: 16px;

            font-weight: bold;

        }


        /* ==============================
           PARAGRAPH
        ============================== */

        .paragraph-area {

            flex: 1;

            overflow-y: auto;

            padding: 22px;

            font-size: 18px;

            line-height: 1.8;

            white-space: pre-wrap;

            user-select: none;

            cursor: default;

        }


        /* ==============================
           TYPING AREA
        ============================== */

        .typing-area {

            flex: 1;

            width: 100%;

            resize: none;

            border: 0;

            outline: none;

            padding: 22px;

            font-family: Arial, "Noto Sans Devanagari", sans-serif;

            font-size: 18px;

            line-height: 1.8;

            color: #111;

            background: #fff;

            spellcheck: false;

        }


        .typing-area:focus {

            outline: none;

        }


        /* ==============================
           BOTTOM BAR
        ============================== */

        .bottom-bar {

            height: 50px;

            background: #f7f7f7;

            border-top: 1px solid #aeb7c2;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 6px 12px;

        }


        .tools {

            display: flex;

            gap: 6px;

        }


        .tool-button {

            background: #fff;

            border: 1px solid #888;

            border-radius: 3px;

            padding: 7px 13px;

            cursor: pointer;

            font-size: 14px;

        }


        .tool-button:hover {

            background: #e5e5e5;

        }


        .status {

            font-size: 13px;

            color: #555;

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 800px) {

            body {

                overflow: auto;

            }


            .exam-header {

                height: auto;

                flex-direction: column;

                padding: 10px;

            }


            .exam-title {

                font-size: 18px;

            }


            .exam-info {

                width: 100%;

                justify-content: center;

                flex-wrap: wrap;

            }


            .exam-container {

                height: auto;

            }


            .exam-panels {

                grid-template-columns: 1fr;

                height: auto;

            }


            .panel {

                height: 450px;

            }


            .bottom-bar {

                height: auto;

                gap: 8px;

                flex-wrap: wrap;

            }

        }

    </style>

</head>


<body>


    <!-- ==============================
         HEADER
    ============================== -->

    <header class="exam-header">


        <div class="exam-title">

            GCC TBC TYPING EXAM

        </div>


        <div class="exam-info">


            <div class="info-box">

                भाषा:

                <span id="languageDisplay">---</span>

            </div>


            <div class="info-box">

                Speed:

                <span id="speedDisplay">---</span>

                WPM

            </div>


            <div

                class="timer"

                id="timer"

            >

                07:00

            </div>


        </div>


    </header>



    <!-- ==============================
         EXAM PANELS
    ============================== -->

    <main class="exam-container">


        <div class="exam-panels">


            <!-- LEFT SIDE -->

            <section class="panel">


                <div class="panel-title">

                    Paragraph

                </div>


                <div

                    id="paragraph"

                    class="paragraph-area"

                    oncopy="return false"

                    oncut="return false"

                    onpaste="return false"

                    oncontextmenu="return false"

                >

                    Paragraph Loading...

                </div>


            </section>



            <!-- RIGHT SIDE -->

            <section class="panel">


                <div class="panel-title">

                    Typing Area

                </div>


                <textarea

                    id="typingArea"

                    class="typing-area"

                    spellcheck="false"

                    autocomplete="off"

                    autocorrect="off"

                    autocapitalize="off"

                    oncopy="return false"

                    oncut="return false"

                    onpaste="return false"

                    oncontextmenu="return false"

                ></textarea>


            </section>


        </div>


    </main>



    <!-- ==============================
         BOTTOM BAR
    ============================== -->

    <div class="bottom-bar">


        <div class="tools">


            <button

                type="button"

                class="tool-button"

                onclick="changeFontSize(1)"

            >

                Zoom +

            </button>


            <button

                type="button"

                class="tool-button"

                onclick="changeFontSize(-1)"

            >

                Zoom -

            </button>


            <button

                type="button"

                class="tool-button"

                onclick="goFullScreen()"

            >

                Full Screen

            </button>


        </div>


        <div class="status">

            Backspace: Allowed

        </div>


    </div>



    <!-- ==============================
         JAVASCRIPT FILES
    ============================== -->

    <script src="paragraphs.js"></script>

    <script src="exam.js"></script>


</body>

</html>
